name: Release packages

on:
  pull_request:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: Package and install (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Build release executables
        run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Package release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/package_release.py --target '${{ matrix.target }}' --tag "$RELEASE_TAG"
          else
            python scripts/package_release.py --target '${{ matrix.target }}'
          fi
      - name: Test installers
        run: |
          python -m pip install build httpx
          node --test cli-typescript/test/*.test.js
          python -m unittest discover -s cli-python/tests
          python -m unittest discover -s scripts/tests
      - name: Install and run the packed npm and Python packages
        run: python scripts/smoke_packages.py --archive 'target/release/ast-bro-${{ matrix.platform }}.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: target/release/ast-bro-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Attach tested archives to a draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Upload release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/*.zip
          else
            gh release create "$RELEASE_TAG" release-artifacts/*.zip --draft --verify-tag --title "ast-bro v$RELEASE_TAG" --generate-notes
          fi
